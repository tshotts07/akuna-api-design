openapi: 3.1.0

info:
  title: Electronic Trading API
  version: 1.0.0
  description: >
    A RESTful API for a simplified electronic trading platform.

servers:
  - url: https://api.example.com/v1
    description: Example production server

tags:
  - name: Instruments
    description: Tradable financial instruments.
  - name: Orders
    description: Order submission and management.
  - name: Positions
    description: Current client positions.

security:
  - ApiKeyAuth: []

paths:

  /instruments:
    get:
      tags:
        - Instruments
      summary: List instruments
      description: Returns all financial instruments currently available for trading.
      operationId: listInstruments

      parameters:
        - name: limit
          in: query
          description: Maximum number of instruments to return.
          required: false
          schema:
            type: Integer
            minimum: 1
            maximum: 100
            default: 50
        
        - name: cursor
          in: query
          description: Cursor returned by a previous request for pagination.
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Instruments successfully retrieved.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Instrument'

                  next_cursor:
                    type:
                      - string
                      - "null"
                    example: eyJvZmZzZXQiOjUwfQ==
        '401':
          $ref: '#/components/responses/Unauthorized'

        '429':
          $ref: '#/components/responses/RateLimited'

        '500':
          $ref: '#/components/responses/InternalServerError'

  /instruments/{symbol}:
    get:
      tags:
        - Instruments
      summary: Retrieve an instrument
      description: Returns information about a specific financial instrument.
      operationId: getInstrument

      parameters:
        - name: symbol
          in: path
          required: true
          description: Trading symbol for the instrument.
          schema:
            type: string
          examples: AAPL
      
      responses:
        '200':
          description: Instrument successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        
        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Instrument does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INSTRUMENT_NOT_FOUND
                  message: The requested instrument does not exist.
        
        '429':
          $ref: '#/components/responses/RateLimited'

        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders:
    post:
      summary: Submit new order
      description: Creates a new buy or sell order for a financial instrument.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
                - side
                - type
                - quantity
                
              properties:
                symbol:
                  type: string
                  example: AAPL
                  
                side:
                  type: string
                  enum:
                    - buy
                    - sell
                    
                type:
                  type: string
                  enum:
                    - market
                    - limit
                    
                quantity:
                  type: integer
                  minimum: 1
                  example: 100
                  
                limit_price:
                  type: number
                  exclusiveMinimum: 0
                  example: 220.00

              if:
                properties:
                  type:
                    const: limit

              then:
                required:
                  - limit_price


      responses:
        '201':
          description: Order successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: ord_8f72a1

                  symbol:
                    type: string
                    example: AAPL

                  side:
                    type: string
                    enum:
                      - buy
                      - sell

                  type:
                    type: string
                    enum:
                      - market
                      - limit

                  quantity:
                    type: integer
                    example: 100

                  limit_price:
                    type:
                      - number
                      - "null"
                    example: 220.00

                  filled_quantity:
                    type: integer
                    example: 0

                  status:
                    type: string
                    enum:
                      - open
                      - partially_filled
                      - filled
                      - cancelled

                  created_at:
                    type: string
                    format: date-time
                    example: "2026-08-17T22:02:00Z"
